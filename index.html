<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Station météo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Météo">
<meta name="theme-color" content="#0b1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Concept : tableau de bord mural en deux niveaux, l'état présent à gauche, le détail à droite, puis 24 h et 5 jours */
:root{
  --bg:#0b1016; --surface:#131a23; --surface-2:#1a232e; --line:#26313f;
  --fg:#e9eff6; --muted:#8d9bab;
  --warm:#f4a93b; --cool:#5db4ea; --cloud:#aebccb; --snow:#cfe6ff;
  --good:#6fcf8a; --warn:#f2c94c; --orange:#f2994a; --bad:#eb5757;
  --mood:var(--warm); --r:20px; color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#eef2f6; --surface:#ffffff; --surface-2:#f3f6fa; --line:#dbe3ec;
    --fg:#14202c; --muted:#5d6b7b;
    --warm:#d97a06; --cool:#1c7fc0; --cloud:#5d6b7b; --snow:#4a90c8;
    --good:#2e9e55; --warn:#b98a00; --orange:#d9701c; --bad:#c93a3a;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%;
  padding-block:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:1400px;margin:0 auto;display:grid;gap:16px}

/* En-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.chipwrap{display:inline-flex;align-items:center;gap:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.x{border:0;background:var(--surface-2);width:28px;height:28px;border-radius:50%;line-height:1;font-size:18px;color:var(--muted)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px 16px;color:var(--muted)}
.ghost[aria-pressed="true"]{color:var(--fg);border-color:var(--muted)}
.clock{text-align:right}
.clock b{display:block;font-size:34px;font-weight:300;letter-spacing:.02em;line-height:1.1}
.clock span{color:var(--muted);text-transform:capitalize}

/* Recherche */
.search{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.search-row{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 220px;min-width:0;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.search input:focus-visible,button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.results{display:grid;gap:6px}
.res{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px}
.res small{color:var(--muted)}
.note{color:var(--muted);font-size:14px}

/* Grille principale */
.main{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.main{grid-template-columns:minmax(300px,1fr) 2fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero{display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.hero[data-mood="clear"]{--mood:var(--warm)}
.hero[data-mood="cloud"]{--mood:var(--cloud)}
.hero[data-mood="rain"]{--mood:var(--cool)}
.hero[data-mood="snow"]{--mood:var(--snow)}
.hero[data-mood="storm"]{--mood:var(--orange)}
.hero[data-mood="night"]{--mood:var(--cool)}
.hero-top{display:flex;align-items:center;gap:14px;color:var(--mood)}
.cond{font-size:24px;font-weight:500;color:var(--fg)}
.temp{font-size:clamp(88px,13vw,170px);font-weight:200;line-height:1;color:var(--mood);letter-spacing:-.03em}
.temp span{font-size:.3em;font-weight:300;letter-spacing:0;margin-left:.08em;vertical-align:.95em}
.feels{font-size:20px}
.sunline{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.sunline b{color:var(--warm);font-weight:500}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-content:stretch}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tl{color:var(--muted);font-size:14px}
.tv{font-size:32px;font-weight:500;line-height:1.15;display:flex;align-items:center;gap:10px}
.tv small{font-size:16px;font-weight:400;color:var(--muted)}
.ts{color:var(--muted);font-size:14px}
.tile{text-align:center}
.tl{font-weight:700;text-align:center}
.tv{flex:1;justify-content:center;text-align:center}
.ts{text-align:center}
.tile .tl{color:var(--fg)}
.tile .tv,.tile .tv small{color:var(--cool)}
.tile .ts{color:var(--fg)}
.tile .tl,.tile .ts{font-size:var(--fs,15px)}
.q{color:var(--warm);font-weight:inherit}
#status:not(.err){color:var(--fg)}
body.measure #tiles .tl,body.measure #tiles .ts,body.measure .day .c{white-space:nowrap}
.meter{height:6px;border-radius:3px;background:var(--surface-2);margin-top:auto;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:currentColor}
.good{color:var(--good)}.warn{color:var(--warn)}.orange{color:var(--orange)}.bad{color:var(--bad)}.cool{color:var(--cool)}

/* 24 h */
.sec-t{display:flex;justify-content:space-between;gap:12px;color:var(--fg);font-size:14px;margin-bottom:8px;flex-wrap:wrap}
#hourly{position:relative;height:230px}
.hourly svg{position:absolute;inset:0;width:100%;height:100%}
.hourly .bar{fill:var(--cool);opacity:.28}
.hourly .line{fill:none;stroke:var(--warm);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.hourly .dot{fill:var(--warm)}
.hourly .now{fill:var(--bg);stroke:var(--warm);stroke-width:3}
.hourly .tv-t{fill:var(--warm);font-size:17px;font-weight:500;text-anchor:middle}
.hourly .hr-t{fill:var(--fg);font-size:14px;text-anchor:middle}
.hourly .wd path{fill:none;stroke:var(--cloud);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hourly .wi-t{fill:var(--warm);font-size:14px}
.hourly .gu path{stroke:var(--warn)}
.hourly .wi-t.gu{fill:var(--warn)}

/* 5 jours */
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;min-width:0}
.day .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day h3{margin:0;font-size:17px;font-weight:600;text-transform:capitalize}
.day .c{color:var(--fg);font-size:var(--fs,15px)}
.day .ico{color:var(--cloud)}
.day.rain .ico{color:var(--cool)}.day.clear .ico{color:var(--warm)}.day.storm .ico{color:var(--orange)}.day.snow .ico{color:var(--snow)}
.range{position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
.range i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cool),var(--warm))}
.mm{display:flex;justify-content:space-between;font-size:20px;font-weight:500}
.mm span:last-child{color:var(--cool)}
.mm span:first-child{color:var(--warm)}

/* Pied */
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--orange)}
.citybar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;min-width:0}
.citybar[hidden],.search[hidden]{display:none}

/* Mode nuit automatique : palette atténuée quand il fait nuit sur la ville affichée */
body.night{
  --bg:#000; --surface:#080b0f; --surface-2:#0e1319; --line:#1a222c;
  --fg:#aab5c1; --muted:#5f6c7a;
  --warm:#b8791f; --cool:#3f7fa8; --cloud:#6f7c8a; --snow:#8fa8c2;
  --good:#4a9a62; --warn:#a88a22; --orange:#b06f2e; --bad:#a84444;
  color-scheme:dark;
}

/* Alertes */
.alert{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;border:1px solid var(--warn);color:var(--warn);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:500}
.alert.l2{border-color:var(--bad);color:var(--bad)}
.alert[hidden]{display:none}
.alert svg{flex:none}

.moon{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.moon svg{color:var(--snow)}

/* Pluie à venir */
.rainsoon{color:var(--fg);font-size:clamp(14px,2.2vh,18px);min-height:1.2em}

/* Radar */
.radar{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding-block:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-bottom));
  padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.radar[hidden]{display:none}
.radar-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.radar-bar b{font-weight:600;font-size:18px;margin-right:auto}
#radarMap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);min-height:200px;background:#0b1016}
#radarTime{color:var(--muted)}
.radar{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.radar-open .foot{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{position:relative}

/* iPad et grands écrans : tout tient sur un seul écran, sans défilement */
@media (min-width:760px) and (min-height:560px){
  html,body{height:100%;overflow:hidden}
  body{height:100dvh}
  .app{height:100%;grid-template-rows:auto minmax(0,1.5fr) minmax(0,1fr) auto auto;gap:12px}
  .search{position:absolute;top:64px;left:0;right:0;z-index:5;max-height:60vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .chip{padding:8px 16px}
  .ghost{padding:8px 14px}
  .clock b{font-size:28px}
  .main{min-height:0;grid-template-columns:minmax(230px,1fr) 3fr;gap:12px}
  .sunline{font-size:14px;gap:2px 12px}
  .moon .mn{display:none}
  .hero{padding:14px 18px;min-height:0;overflow:hidden}
  .temp{font-size:clamp(64px,12vh,150px)}
  .cond{font-size:clamp(18px,2.8vh,24px)}
  .hero-top svg{width:clamp(44px,7vh,76px);height:clamp(44px,7vh,76px)}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
  .tv{gap:6px}
  .tv small{font-size:14px}
  .tv svg{flex:none;width:clamp(16px,2.6vh,26px);height:clamp(16px,2.6vh,26px)}
  .tile{padding:8px 11px;min-height:0;overflow:hidden}
  .tv{font-size:clamp(20px,3.2vh,32px)}
  .hourly{display:flex;flex-direction:column;min-height:0;padding:10px 18px 12px}
  #hourly{flex:1;min-height:0;height:auto}
  .days{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .day{padding:10px 14px;gap:5px}
  .day .ico svg{width:34px;height:34px}
  .day h3{font-size:16px}
  .mm{font-size:18px}
  .foot{margin-top:-2px}
}
@media (min-width:760px) and (min-height:560px) and (max-height:900px){
  .day .cd{display:none}
}
@media (prefers-reduced-motion:no-preference){.card,.tile,.day{transition:opacity .25s}}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="citybar" id="citybar">
    <div class="chips" id="chips"></div>
    <div class="grp" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" id="btnSearch" aria-label="Ajouter une ville">+ Ville</button>
      <button class="ghost" id="btnGeo" aria-label="Utiliser ma position">Ma position</button>
      <button class="ghost" id="btnEdit" aria-pressed="false">Modifier</button>
    </div>
    </div>
    <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    <div class="alert" id="alerts" hidden></div>
  </header>

  <section class="search" id="search" hidden>
    <div class="search-row">
      <input id="q" type="search" placeholder="Nom d'une ville" autocomplete="off" aria-label="Rechercher une ville">
      <button class="ghost" id="btnClose">Fermer</button>
    </div>
    <div class="results" id="results"></div>
  </section>

  <section class="main">
    <article class="card hero" id="hero"><div class="cond">Chargement…</div></article>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="card hourly">
    <div class="sec-t"><span>Prochaines 24 h</span><span>Courbe : température · barres : probabilité de pluie · bas : vent (km/h)</span></div>
    <div id="hourly"></div>
  </section>

  <section class="days" id="days"></section>

  <footer class="foot">
    <span id="status">Chargement…</span>
    <span class="grp">
      <button class="ghost" id="btnRadar">Radar</button>
      <button class="ghost" id="btnWake" aria-pressed="true">Écran allumé</button>
      <button class="ghost" id="btnCities" aria-pressed="true">Villes</button>
      <button class="ghost" id="btnFull" aria-pressed="false">Plein écran</button>
      <button class="ghost" id="btnRefresh">Actualiser</button>
    </span>
  </footer>
</div>

<div class="radar" id="radar" hidden>
  <div class="radar-bar">
    <b>Radar de pluie</b>
    <span id="radarTime"></span>
  </div>
  <div id="radarMap"></div>
  <div class="note" id="radarNote"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r = v => Math.round(v);
const q = x => '<b class="q">' + x + '</b>';
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

const DEFAULTS = [
  {name:'Roanne', lat:46.0372, lon:4.0686},
  {name:'Lyon',   lat:45.7640, lon:4.8357},
  {name:'Paris',  lat:48.8566, lon:2.3522}
];
let cities = store.get('wx.cities', DEFAULTS);
if (!Array.isArray(cities) || !cities.length) cities = DEFAULTS.slice();
let idx = Math.min(Math.max(0, store.get('wx.idx', 0)), cities.length - 1);
let cache = store.get('wx.cache', {});
let editing = false, wantWake = store.get('wx.wake', true), wl = null, reqId = 0;
const key = c => c.lat.toFixed(2) + ',' + c.lon.toFixed(2);

/* ---------- Icônes (trait) ---------- */
const CLOUD = '<path d="M20 46h25a9 9 0 0 0 1.5-17.9A13 13 0 0 0 21.6 25 10.5 10.5 0 0 0 20 46z"/>';
const A8 = [0,45,90,135,180,225,270,315];
function rays(cx, cy, r1, r2, A = A8){
  return A.map(d => {
    const a = d * Math.PI / 180;
    return `<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}"/>`;
  }).join('');
}
const MOON = '<path d="M42 12a20 20 0 1 0 12 30A16 16 0 0 1 42 12z"/>';
const ICONS = {
  sun: `<circle cx="32" cy="32" r="10"/>${rays(32,32,16,23)}`,
  moon: MOON,
  cloud: CLOUD,
  partly: `<circle cx="22" cy="22" r="7"/>${rays(22,22,11,15,[135,180,225,270,315])}<g transform="translate(9 9) scale(.78)">${CLOUD}</g>`,
  partlyN: `<g transform="translate(-4 -2) scale(.55)">${MOON}</g><g transform="translate(9 9) scale(.78)">${CLOUD}</g>`,
  rain: `${CLOUD}<line x1="24" y1="52" x2="21" y2="58"/><line x1="33" y1="52" x2="30" y2="58"/><line x1="42" y1="52" x2="39" y2="58"/>`,
  snow: `${CLOUD}<circle cx="24" cy="54" r="1.6" fill="currentColor"/><circle cx="33" cy="57" r="1.6" fill="currentColor"/><circle cx="42" cy="54" r="1.6" fill="currentColor"/>`,
  storm: `${CLOUD}<polyline points="34,46 28,55 35,55 30,62"/>`,
  fog: '<line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="33" x2="48" y2="33"/><line x1="14" y1="42" x2="54" y2="42"/><line x1="10" y1="51" x2="44" y2="51"/>'
};
function svgIcon(name, size){
  return `<svg class="ic" viewBox="0 0 64 64" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}
function iconFor(i, night){
  if (night && i === 'sun') return 'moon';
  if (night && i === 'partly') return 'partlyN';
  return i;
}

/* ---------- Météo ---------- */
function WMO(c){
  if (c === 0) return {t:'Ciel dégagé', i:'sun', m:'clear'};
  if (c <= 2) return {t:'Peu nuageux', i:'partly', m:'cloud'};
  if (c === 3) return {t:'Couvert', i:'cloud', m:'cloud'};
  if (c === 45 || c === 48) return {t:'Brouillard', i:'fog', m:'cloud'};
  if (c >= 51 && c <= 57) return {t:'Bruine', i:'rain', m:'rain'};
  if (c >= 61 && c <= 67) return {t:'Pluie', i:'rain', m:'rain'};
  if (c >= 71 && c <= 77) return {t:'Neige', i:'snow', m:'snow'};
  if (c >= 80 && c <= 82) return {t:'Averses', i:'rain', m:'rain'};
  if (c === 85 || c === 86) return {t:'Averses de neige', i:'snow', m:'snow'};
  if (c >= 95) return {t:'Orage', i:'storm', m:'storm'};
  return {t:'Inconnu', i:'cloud', m:'cloud'};
}
const PTS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const compass = d => PTS[Math.floor(((d + 11.25) % 360) / 22.5)];
const hm = iso => (iso || '').slice(11, 16);

function aqiInfo(v){
  if (v == null) return ['--', '', 0];
  if (v < 20)  return ['Bon', 'good', v];
  if (v < 40)  return ['Correct', 'good', v];
  if (v < 60)  return ['Moyen', 'warn', v];
  if (v < 80)  return ['Médiocre', 'orange', v];
  if (v < 100) return ['Mauvais', 'bad', v];
  return ['Très mauvais', 'bad', v];
}

const POL = {
  grass:['Graminées',[20,50,150]], birch:['Bouleau',[15,90,1500]], alder:['Aulne',[15,90,1500]],
  olive:['Olivier',[15,90,1500]], mugwort:['Armoise',[10,50,150]], ragweed:['Ambroisie',[5,20,100]]
};
const POLLV = ['Aucun','Faible','Modéré','Élevé','Très élevé'], POLLC = ['good','good','warn','orange','bad'];
function pollenInfo(p){
  if (!p) return null;
  let best = null;
  for (const k in POL){
    const v = p[k + '_pollen'];
    if (v == null) continue;
    const t = POL[k][1], rel = v / t[0];
    const lvl = v <= 0 ? 0 : v < t[0] ? 1 : v < t[1] ? 2 : v < t[2] ? 3 : 4;
    if (!best || lvl > best.lvl || (lvl === best.lvl && rel > best.rel)) best = {name:POL[k][0], v, lvl, rel};
  }
  return best;
}

async function getJson(url){
  const opt = {};
  if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) opt.signal = AbortSignal.timeout(10000);
  const res = await fetch(url, opt);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function fetchWx(c){
  const f = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover' +
    '&hourly=temperature_2m,precipitation_probability,precipitation,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m,snowfall,snow_depth,freezing_level_height&past_hours=3' +
    '&minutely_15=precipitation' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum,sunshine_duration,wind_gusts_10m_max' +
    '&timezone=auto&forecast_days=5';
  const a = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + c.lat + '&longitude=' + c.lon +
    '&current=european_aqi&timezone=auto';
  const pu = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + c.lat + '&longitude=' + c.lon +
    '&current=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto';
  const [w, air, pol] = await Promise.all([getJson(f), getJson(a).catch(() => null), getJson(pu).catch(() => null)]);
  return {w, aqi: air && air.current ? air.current.european_aqi : null, pol: pol && pol.current ? pol.current : null, at: Date.now()};
}

/* ---------- Lune et durée du jour ---------- */
const MOONS = ['Nouvelle lune','Premier croissant','Premier quartier','Gibbeuse croissante','Pleine lune','Gibbeuse décroissante','Dernier quartier','Dernier croissant'];
function moonTime(k){
  const T = k / 1236.85, D = Math.PI / 180, full = k % 1 !== 0, sn = Math.sin;
  const M = (2.5534 + 29.1053567 * k - 0.0000014 * T * T) * D;
  const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T * T) * D;
  const F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T) * D;
  const E = 1 - 0.002516 * T - 0.0000074 * T * T;
  let j = 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T;
  j += (full ? -0.40614 * sn(Mp) + 0.17302 * E * sn(M) + 0.01614 * sn(2 * Mp) + 0.01043 * sn(2 * F) + 0.00734 * E * sn(Mp - M) - 0.00515 * E * sn(Mp + M) + 0.00209 * E * E * sn(2 * M)
               : -0.40720 * sn(Mp) + 0.17241 * E * sn(M) + 0.01608 * sn(2 * Mp) + 0.01039 * sn(2 * F) + 0.00739 * E * sn(Mp - M) - 0.00514 * E * sn(Mp + M) + 0.00208 * E * E * sn(2 * M))
     - 0.00111 * sn(Mp - 2 * F) - 0.00057 * sn(Mp + 2 * F) + 0.00056 * E * sn(2 * Mp + M) - 0.00042 * sn(3 * Mp) + 0.00042 * E * sn(M + 2 * F) + 0.00038 * E * sn(M - 2 * F) - 0.00024 * E * sn(2 * Mp - M);
  return (j - 2440587.5) * 86400000;
}
function moonPhase(date){
  const now = date.getTime();
  let k = Math.floor((now - Date.UTC(2000, 0, 6, 18, 14)) / 86400000 / 29.530588853);
  while (moonTime(k) > now) k--;
  while (moonTime(k + 1) <= now) k++;
  const t0 = moonTime(k), t1 = moonTime(k + 1), tf = moonTime(k + .5);
  const p = (now - t0) / (t1 - t0);
  return {p, name: MOONS[Math.floor(p * 8 + .5) % 8], next: now < tf ? {full:true, t:tf} : {full:false, t:t1}};
}
function moonSvg(p){
  const k = Math.cos(2 * Math.PI * p), rx = (Math.abs(k) * 9).toFixed(2), sw = k > 0 ? 0 : 1;
  const lit = `<path d="M12 3A9 9 0 0 1 12 21A${rx} 9 0 0 ${sw} 12 3z" fill="currentColor" stroke="none"${p > .5 ? ' transform="translate(24 0) scale(-1 1)"' : ''}/>`;
  return `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>${lit}</svg>`;
}
function dayLen(sr, ss){
  const a = hm(sr).split(':').map(Number), b = hm(ss).split(':').map(Number);
  if (a.length < 2 || b.length < 2 || isNaN(a[0]) || isNaN(b[0])) return '';
  return dur(Math.max(0, (b[0] * 60 + b[1]) - (a[0] * 60 + a[1])));
}
function hourStart(d){
  const h = d.w.hourly, s = h.time.findIndex(t => t.startsWith(d.w.current.time.slice(0, 13)));
  return s < 0 ? 0 : s;
}

/* ---------- Rendu ---------- */
function renderHero(d){
  const c = d.w.current, dly = d.w.daily, m = WMO(c.weather_code), night = !c.is_day, mp = moonPhase(new Date());
  const el = $('#hero');
  el.dataset.mood = (night && m.m === 'clear') ? 'night' : m.m;
  el.innerHTML =
    `<div class="hero-top">${svgIcon(iconFor(m.i, night), 84)}<div class="cond">${esc(m.t)}</div></div>` +
    `<div class="temp">${r(c.temperature_2m)}<span>°C</span></div>` +
    `<div class="feels">Ressenti ${q(r(c.apparent_temperature) + '°C')}</div>` +
    `<div class="rainsoon">${rainSoon(d)}</div>` +
    `<div class="sunline"><span>Lever <b>${hm(dly.sunrise[0])}</b></span><span>Coucher <b>${hm(dly.sunset[0])}</b></span>` +
    `<span class="moon">${moonSvg(mp.p)}<span class="mn">${mp.name} · </span>${mp.next.full ? 'Pleine lune' : 'Nouvelle lune'}<b>${new Date(mp.next.t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}</b></span></div>`;
}

function tile(label, value, sub, cls, pct){
  return `<div class="tile"><div class="tl">${label}</div><div class="tv ${cls || ''}">${value}</div>` +
    `<div class="ts">${sub || '&nbsp;'}</div>` +
    (pct != null ? `<div class="meter ${cls || ''}"><i style="width:${Math.max(2, Math.min(100, pct))}%"></i></div>` : '') + `</div>`;
}

function renderTiles(d){
  const c = d.w.current, dly = d.w.daily;
  const uv = dly.uv_index_max[0];
  const uvI = uv < 3 ? ['Faible','good'] : uv < 6 ? ['Modéré','warn'] : uv < 8 ? ['Élevé','orange'] : ['Très élevé','bad'];
  const ai = aqiInfo(d.aqi), pi = pollenInfo(d.pol);
  const hh = d.w.hourly, s0 = hourStart(d);
  let rain24 = null;
  if (hh.precipitation){ rain24 = 0; for (let i = s0; i < Math.min(s0 + 24, hh.precipitation.length); i++) rain24 += hh.precipitation[i] || 0; }
  let ptxt = 'Pression au sol', parrow = '';
  if (hh.surface_pressure && s0 >= 3 && hh.surface_pressure[s0] != null && hh.surface_pressure[s0 - 3] != null){
    const dp = hh.surface_pressure[s0] - hh.surface_pressure[s0 - 3];
    const lab = dp >= 1 ? 'En hausse' : dp <= -1 ? 'En baisse' : 'Stable';
    const rot = dp >= 1 ? 180 : dp <= -1 ? 0 : -90;
    ptxt = `${lab} · ${q((dp > 0 ? '+' : dp < 0 ? '−' : '') + Math.abs(dp).toFixed(1) + ' hPa')} / 3 h`;
    parrow = `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${rot}deg)" aria-hidden="true"><line x1="12" y1="4" x2="12" y2="20"/><polyline points="6,14 12,20 18,14"/></svg>`;
  }
  const cc = c.cloud_cover, sun = dly.sunshine_duration ? dly.sunshine_duration[0] : null;
  let tmin = null, frostAt = -1, snow = null;
  const e24 = Math.min(s0 + 24, hh.time.length);
  for (let i = s0; i < e24; i++){
    const t = hh.temperature_2m[i];
    if (t != null){ if (tmin == null || t < tmin) tmin = t; if (frostAt < 0 && t <= 0) frostAt = i; }
  }
  if (hh.snowfall){ snow = 0; for (let i = s0; i < e24; i++) snow += hh.snowfall[i] || 0; }
  const depth = hh.snow_depth ? (hh.snow_depth[s0] || 0) * 100 : 0;
  const fl = hh.freezing_level_height ? hh.freezing_level_height[s0] : null;
  const frostCls = tmin == null ? '' : tmin <= -5 ? 'bad' : tmin <= 0 ? 'orange' : tmin <= 2 ? 'warn' : 'good';
  const frostTxt = tmin == null ? 'Indisponible' : frostAt === s0 ? 'Gel en cours' : frostAt > s0 ? 'Gel dès ' + q(hh.time[frostAt].slice(11, 13) + ' h') : tmin <= 2 ? 'Gel au sol possible' : 'Pas de gel';
  const snowTxt = snow > .05 ? (fl != null ? 'Isotherme 0 °C : ' + q((Math.round(fl / 50) * 50) + ' m') : 'Neige prévue') : depth >= 1 ? 'Au sol : ' + q(r(depth) + ' cm') : 'Pas de neige';
  const arrow = `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${r(c.wind_direction_10m + 180)}deg)" aria-hidden="true"><line x1="12" y1="4" x2="12" y2="20"/><polyline points="6,14 12,20 18,14"/></svg>`;
  $('#tiles').innerHTML =
    tile(rain24 == null ? 'Pluie' : 'Pluie 24 h', `${(rain24 == null ? c.precipitation : rain24).toFixed(1)}<small>mm</small>`, `Actuel ${q(c.precipitation.toFixed(1) + ' mm')} · max ${q(r(dly.precipitation_probability_max[0] || 0) + ' %')}`, 'cool', null) +
    tile('Pression', `${r(c.surface_pressure)}<small>hPa</small>${parrow}`, ptxt, '', null) +
    tile('Neige 24 h', snow == null ? '--' : `${snow.toFixed(1)}<small>cm</small>`, snow == null ? 'Indisponible' : snowTxt, snow > .05 ? 'cool' : '', null) +
    tile('Nuages', cc == null ? '--' : `${r(cc)}<small>%</small>`, sun == null ? '' : 'Soleil ' + q(dur(Math.round(sun / 60))) + ' aujourd’hui', '', cc == null ? null : cc) +
    tile('Qualité de l\'air', d.aqi == null ? '--' : `${r(d.aqi)}`, ai[0] === '--' ? 'Indisponible' : ai[0], ai[1], d.aqi == null ? null : d.aqi) +
    tile('Vent', `${r(c.wind_speed_10m)}<small>km/h</small>${arrow}`, `${q(compass(c.wind_direction_10m))} · rafales ${q(r(c.wind_gusts_10m) + ' km/h')}`, '', null) +
    tile('Humidité', `${r(c.relative_humidity_2m)}<small>%</small>`, '', 'cool', c.relative_humidity_2m) +
    tile('Gel 24 h', tmin == null ? '--' : `${String(r(tmin)).replace('-', '−')}<small>°C min</small>`, frostTxt, frostCls, null) +
    tile('Indice UV max', `${uv.toFixed(1)}`, uvI[0], uvI[1], uv / 11 * 100) +
    tile('Pollens', pi ? (pi.lvl ? `${pi.v < 10 ? pi.v.toFixed(1) : r(pi.v)}<small>gr/m³</small>` : 'Aucun') : '--',
      pi ? (pi.lvl ? `${pi.name} · ${POLLV[pi.lvl]}` : 'Hors saison') : 'Indisponible', pi ? POLLC[pi.lvl] : '', pi && pi.lvl ? pi.lvl / 4 * 100 : null);
}

function renderHourly(d){
  const h = d.w.hourly, cur = d.w.current;
  let s = h.time.findIndex(t => t.startsWith(cur.time.slice(0, 13)));
  if (s < 0) s = 0;
  const N = Math.min(24, h.time.length - s);
  const box = $('#hourly');
  const W = Math.max(320, box.clientWidth), H = Math.max(110, box.clientHeight);
  const pl = 30, pr = 30, y0 = 36, y1 = H - 62, base = H - 48;
  const T = h.temperature_2m.slice(s, s + N), P = h.precipitation_probability.slice(s, s + N);
  const WS = h.wind_speed_10m ? h.wind_speed_10m.slice(s, s + N) : null, WD = h.wind_direction_10m ? h.wind_direction_10m.slice(s, s + N) : null, WG = h.wind_gusts_10m ? h.wind_gusts_10m.slice(s, s + N) : null;
  let tmin = Math.min(...T), tmax = Math.max(...T);
  if (tmax - tmin < 4){ tmax += 2; tmin -= 2; }
  const step = (W - pl - pr) / (N - 1), bw = step * .55;
  let bars = '', pts = [], dots = '', labels = '';
  for (let i = 0; i < N; i++){
    const x = pl + i * step;
    const y = y1 - (T[i] - tmin) / (tmax - tmin) * (y1 - y0);
    const bh = (P[i] || 0) / 100 * (base - 14);
    bars += `<rect class="bar" x="${(x - bw/2).toFixed(1)}" y="${(base - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3"/>`;
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    dots += i === 0
      ? `<circle class="now" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`
      : `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`;
    if (i % 3 === 0){
      labels += `<text class="tv-t" x="${x.toFixed(1)}" y="${(y - 16).toFixed(1)}">${r(T[i])}°</text>`;
      labels += `<text class="hr-t" x="${x.toFixed(1)}" y="${H - 10}">${i === 0 ? 'Maint.' : h.time[s + i].slice(11, 13) + ' h'}</text>`;
      if (WS && WD && WS[i] != null){
        const gu = WG && WG[i] != null && WG[i] >= 60 ? ' gu' : '';
        labels += `<g class="wd${gu}" transform="translate(${(x - 13).toFixed(1)} ${H - 34})"><g transform="rotate(${r((WD[i] || 0) + 180)})"><path d="M0-6V6M-4 2L0 6L4 2"/></g></g>`;
        labels += `<text class="wi-t${gu}" x="${(x - 5).toFixed(1)}" y="${H - 29}">${r(WS[i])}</text>`;
      }
    }
  }
  $('#hourly').innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Température et probabilité de pluie sur 24 heures">${bars}<polyline class="line" points="${pts.join(' ')}"/>${dots}${labels}</svg>`;
}

function renderDays(d){
  const dl = d.w.daily;
  const wmin = Math.min(...dl.temperature_2m_min), wmax = Math.max(...dl.temperature_2m_max);
  const span = Math.max(1, wmax - wmin);
  $('#days').innerHTML = dl.time.slice(0, 5).map((t, i) => {
    const [yy, mm, dd] = t.split('-').map(Number);
    const name = i === 0 ? 'Aujourd’hui' : new Date(yy, mm - 1, dd).toLocaleDateString('fr-FR', {weekday:'long'});
    const m = WMO(dl.weather_code[i]);
    const lo = dl.temperature_2m_min[i], hi = dl.temperature_2m_max[i];
    const left = (lo - wmin) / span * 100, width = Math.max(6, (hi - lo) / span * 100);
    return `<article class="day ${m.m}"><div class="top"><h3>${esc(name)}</h3><div class="ico">${svgIcon(m.i, 44)}</div></div><div class="c cd">${esc(m.t)}</div>` +
      `<div class="range" aria-hidden="true"><i style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%"></i></div>` +
      `<div class="mm"><span>${r(hi)}°</span><span>${r(lo)}°</span></div>` +
      `<div class="c">Pluie ${q(r(dl.precipitation_probability_max[i] || 0) + ' %')}${dl.precipitation_sum ? ' · ' + q((dl.precipitation_sum[i] || 0).toFixed(1) + ' mm') : ''}</div></article>`;
  }).join('');
}

function dur(min){
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
}
function rainSoon(d){
  const m = d.w.minutely_15, c = d.w.current;
  if (!m || !m.time || !m.precipitation) return '';
  const now = new Date(c.time).getTime(), P = m.precipitation;
  let s = 0;
  m.time.forEach((t, i) => { if (new Date(t).getTime() <= now) s = i; });
  const wet = i => (P[i] || 0) >= 0.1;
  const end = Math.min(P.length, s + 13);
  if (wet(s)){
    for (let i = s + 1; i < end; i++) if (!wet(i)) return 'Pluie en cours, fin vers ' + q(hm(m.time[i]));
    return 'Pluie en cours pour les prochaines heures';
  }
  for (let i = s + 1; i < end; i++){
    if (wet(i)) return 'Pluie dans ' + q(dur(Math.max(1, Math.round((new Date(m.time[i]).getTime() - now) / 60000))));
  }
  return 'Pas de pluie dans les ' + q('3 h');
}

function renderAlerts(d){
  const dl = d.w.daily, out = [], days = ['aujourd’hui', 'demain'];
  for (let i = 0; i < 2 && i < dl.time.length; i++){
    const code = dl.weather_code[i], g = (dl.wind_gusts_10m_max || [])[i];
    const lo = dl.temperature_2m_min[i], hi = dl.temperature_2m_max[i], dj = days[i];
    if (code >= 95) out.push({l:2, t:'Orage prévu ' + dj});
    if (g != null && g >= 90) out.push({l:2, t:'Tempête : rafales jusqu’à ' + r(g) + ' km/h ' + dj});
    else if (g != null && g >= 60) out.push({l:1, t:'Vent fort : rafales jusqu’à ' + r(g) + ' km/h ' + dj});
    if (hi >= 35) out.push({l:2, t:'Forte chaleur ' + dj + ' (' + r(hi) + '°C)'});
    if (lo <= 0) out.push({l:1, t:'Gel prévu ' + dj + ' (' + r(lo) + '°C)'});
    if ([71,73,75,77,85,86].includes(code)) out.push({l:1, t:'Neige prévue ' + dj});
    if ([65,67,82].includes(code)) out.push({l:1, t:'Fortes pluies prévues ' + dj});
  }
  const el = $('#alerts');
  if (!out.length){ el.hidden = true; el.innerHTML = ''; return; }
  out.sort((a, b) => b.l - a.l);
  const top = out.slice(0, 3);
  const lvl = top[0].l;
  el.className = 'alert l' + lvl;
  el.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 21h20z"/><line x1="12" y1="10" x2="12" y2="15"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg>' +
    top.map(a => '<span>' + esc(a.t) + '</span>').join('');
  el.hidden = false;
}

function applyNight(d){
  const night = !d.w.current.is_day;
  document.body.classList.toggle('night', night);
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', night ? '#000000' : '#0b1016');
}

function fitFonts(){
  const els = [...document.querySelectorAll('#tiles .tl, #tiles .ts, .day .c')];
  if (!els.length) return;
  const root = document.documentElement.style;
  let fs = 22;
  document.body.classList.add('measure');
  root.setProperty('--fs', fs + 'px');
  while (fs > 14 && els.some(e => e.scrollWidth > e.clientWidth + 1)){ fs -= .5; root.setProperty('--fs', fs + 'px'); }
  document.body.classList.remove('measure');
}
function render(d){ applyNight(d); renderAlerts(d); renderHero(d); renderTiles(d); renderHourly(d); renderDays(d); fitFonts(); }

/* ---------- Villes ---------- */
function renderChips(){
  $('#chips').innerHTML = cities.map((c, i) =>
    `<span class="chipwrap"><button class="chip" data-i="${i}" aria-pressed="${i === idx}">${esc(c.name)}</button>` +
    (editing && cities.length > 1 ? `<button class="x" data-del="${i}" aria-label="Retirer ${esc(c.name)}">×</button>` : '') + `</span>`
  ).join('');
}
function saveCities(){
  store.set('wx.cities', cities); store.set('wx.idx', idx);
  const keep = {}; cities.forEach(c => { const k = key(c); if (cache[k]) keep[k] = cache[k]; });
  cache = keep; store.set('wx.cache', cache);
}
function select(i){
  idx = i; saveCities(); renderChips();
  const d = cache[key(cities[idx])];
  if (d) render(d); else $('#hero').innerHTML = '<div class="cond">Chargement…</div>';
  refresh();
}
function addCity(c){
  const k = key(c);
  const at = cities.findIndex(x => key(x) === k || (c.name === 'Ma position' && x.name === 'Ma position'));
  if (at >= 0){ cities[at] = c; select(at); setCityBar(false); return; }
  if (cities.length >= 8){ setStatus('error', null, 'Liste pleine : retire une ville avec Modifier.'); return; }
  cities.push(c); select(cities.length - 1); setCityBar(false);
}

/* ---------- Réseau et état ---------- */
function setStatus(kind, at, msg){
  const el = $('#status'), t = at ? new Date(at).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
  el.className = kind === 'error' ? 'err' : '';
  if (kind === 'loading') el.textContent = 'Actualisation…';
  else if (kind === 'ok') el.innerHTML = 'Mis à jour à ' + q(t) + ' · données Open-Meteo';
  else el.textContent = msg || (at ? 'Pas de connexion. Données de ' + t + ' affichées.' : 'Impossible de récupérer la météo. Vérifie la connexion.');
}
async function refresh(){
  const my = ++reqId, c = cities[idx];
  lastTry = Date.now();
  setStatus('loading');
  try {
    const d = await fetchWx(c);
    cache[key(c)] = d; store.set('wx.cache', cache);
    if (my === reqId){ render(d); setStatus('ok', d.at); }
  } catch(e){
    if (my === reqId){ const d = cache[key(c)]; setStatus('error', d ? d.at : null); }
  }
}

/* ---------- Horloge, veille, événements ---------- */
let lastTry = 0;
function autoRefresh(){
  if (document.hidden) return;
  const d = cache[key(cities[idx])], now = Date.now();
  if ((!d || now - d.at > 5 * 60 * 1000) && now - lastTry > 60 * 1000) refresh();
}
function tick(){
  autoRefresh();
  const n = new Date();
  $('#time').textContent = n.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  $('#date').textContent = n.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}
async function wake(){
  try {
    if (wantWake && 'wakeLock' in navigator && !wl){
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    }
  } catch(e){ wl = null; }
}
function setWake(on){
  wantWake = on; store.set('wx.wake', on);
  $('#btnWake').setAttribute('aria-pressed', String(on));
  if (on) wake(); else if (wl){ wl.release().catch(() => {}); wl = null; }
}

$('#chips').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del){
    const i = +del.dataset.del;
    cities.splice(i, 1);
    if (idx > i || idx >= cities.length) idx = Math.max(0, idx - 1);
    saveCities(); renderChips(); select(idx); return;
  }
  const b = e.target.closest('[data-i]');
  if (b){ select(+b.dataset.i); setCityBar(false); }
});
function setCityBar(on){
  $('#citybar').hidden = !on;
  $('#btnCities').setAttribute('aria-pressed', String(on));
  if (!on){ editing = false; $('#btnEdit').setAttribute('aria-pressed', 'false'); renderChips(); $('#search').hidden = true; }
}
$('#btnCities').addEventListener('click', () => setCityBar($('#citybar').hidden));
$('#btnEdit').addEventListener('click', e => {
  editing = !editing; e.currentTarget.setAttribute('aria-pressed', String(editing)); renderChips();
});
$('#btnRefresh').addEventListener('click', refresh);
$('#btnWake').addEventListener('click', () => setWake(!wantWake));
$('#btnSearch').addEventListener('click', () => { $('#search').hidden = false; $('#q').focus(); });
$('#btnClose').addEventListener('click', () => { $('#search').hidden = true; $('#results').innerHTML = ''; $('#q').value = ''; });
$('#btnGeo').addEventListener('click', () => {
  if (!navigator.geolocation){ setStatus('error', null, 'Position indisponible sur cet appareil.'); return; }
  navigator.geolocation.getCurrentPosition(
    p => addCity({name:'Ma position', lat:+p.coords.latitude.toFixed(4), lon:+p.coords.longitude.toFixed(4)}),
    () => setStatus('error', null, 'Position refusée. Autorise-la dans les réglages de Safari.'),
    {timeout:10000, maximumAge:600000});
});

let qTimer = 0, qSeq = 0;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (q.length < 2){ $('#results').innerHTML = ''; return; }
  qTimer = setTimeout(async () => {
    const my = ++qSeq;
    try {
      const j = await getJson('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=6&language=fr&format=json');
      if (my !== qSeq) return;
      const list = j.results || [];
      $('#results').innerHTML = list.length
        ? list.map((x, i) => `<button class="res" data-r="${i}">${esc(x.name)} <small>${esc([x.admin1, x.country].filter(Boolean).join(', '))}</small></button>`).join('')
        : '<div class="note">Aucune ville trouvée.</div>';
      $('#results').onclick = ev => {
        const b = ev.target.closest('[data-r]'); if (!b) return;
        const x = list[+b.dataset.r];
        addCity({name:x.name, lat:+x.latitude.toFixed(4), lon:+x.longitude.toFixed(4)});
        $('#btnClose').click();
      };
    } catch(err){ $('#results').innerHTML = '<div class="note">Recherche impossible pour le moment.</div>'; }
  }, 300);
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  tick(); wake();
  const d = cache[key(cities[idx])];
  if (!d || Date.now() - d.at > 10 * 60 * 1000) refresh();
});
const fsEl = document.documentElement;
const fsReq = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
if (!fsReq) $('#btnFull').hidden = true;
$('#btnFull').addEventListener('click', () => {
  try { (fsOn() ? fsExit : fsReq).call(fsOn() ? document : fsEl); } catch(e){}
});
const fsSync = () => $('#btnFull').setAttribute('aria-pressed', String(fsOn()));
document.addEventListener('fullscreenchange', fsSync);
document.addEventListener('webkitfullscreenchange', fsSync);
window.addEventListener('online', refresh);
window.addEventListener('pageshow', autoRefresh);
document.addEventListener('pointerdown', () => { if (wantWake && !wl) wake(); }, {passive:true});

/* ---------- Radar de pluie ---------- */
let rmap = null, rframes = [], rlayers = [], rnPast = 0, rpos = 0, rtimer = 0, rplay = true, rdot = null;
function loadLeaflet(){
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(l);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function radarShow(i){
  rpos = i;
  rlayers.forEach((ly, k) => ly.setOpacity(k === i ? 0.75 : 0));
  const f = rframes[i];
  if (!f) return;
  $('#radarTime').textContent = new Date(f.time * 1000).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) + (i >= rnPast ? ' · prévision' : '');
}
function radarLoop(){
  clearTimeout(rtimer);
  if (!rplay || $('#radar').hidden || !rframes.length) return;
  const nxt = (rpos + 1) % rframes.length;
  rtimer = setTimeout(() => { radarShow(nxt); radarLoop(); }, nxt === 0 ? 1600 : 650);
}
async function openRadar(){
  const c = cities[idx];
  $('#radar').hidden = false;
  $('#radarNote').textContent = c.name + ' · radar RainViewer';
  $('#radarMap').innerHTML = '<iframe title="Radar de pluie" style="width:100%;height:100%;border:0" loading="lazy" allow="geolocation" ' +
    'src="https://www.rainviewer.com/map.html?loc=' + c.lat + ',' + c.lon + ',7&oFa=0&oC=1&oU=0&oCS=1&oF=0&oAP=1&c=3&o=83&lm=1&layer=radar&sm=1&sn=1"></iframe>';
}
function closeRadar(){
  $('#radar').hidden = true; $('#radarMap').innerHTML = '';
  document.body.classList.remove('radar-open');
  $('#btnRadar').setAttribute('aria-pressed', 'false');
}
$('#btnRadar').addEventListener('click', () => {
  if ($('#radar').hidden){
    document.body.classList.add('radar-open');
    $('#btnRadar').setAttribute('aria-pressed', 'true');
    openRadar();
  } else closeRadar();
});

/* ---------- Balayage entre villes ---------- */
let sw0 = null;
document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1 || !$('#radar').hidden || !$('#search').hidden || e.target.closest('input,iframe')){ sw0 = null; return; }
  sw0 = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now()};
}, {passive:true});
document.addEventListener('touchend', e => {
  if (!sw0) return;
  const t = e.changedTouches[0], dx = t.clientX - sw0.x, dy = t.clientY - sw0.y, dt = Date.now() - sw0.t;
  sw0 = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2 || dt > 700 || cities.length < 2) return;
  select((idx + (dx < 0 ? 1 : -1) + cities.length) % cities.length);
}, {passive:true});

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

let fitT = 0;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitFonts, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitFonts);

/* ---------- Démarrage ---------- */
if (typeof ResizeObserver !== 'undefined'){
  new ResizeObserver(() => { const d = cache[key(cities[idx])]; if (d) renderHourly(d); }).observe($('#hourly'));
}
renderChips();
$('#btnWake').setAttribute('aria-pressed', String(wantWake));
tick(); setInterval(tick, 15000);
const first = cache[key(cities[idx])];
if (first){ render(first); setStatus('ok', first.at); }
refresh();
setInterval(refresh, 15 * 60 * 1000);
wake();
})();
</script>
</body>
</html>
